<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator dla Firm</title>
    <!-- Tailwind CSS dla ładnego wyglądu -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Biblioteka Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- NAGŁÓWEK / PANEL UŻYTKOWNIKA -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-400">Kalkulator dla Firm</h1>
        <div id="user-info" class="hidden flex items-center gap-4">
            <span id="user-email" class="text-sm text-slate-300"></span>
            <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded text-sm transition">Wyloguj</button>
        </div>
    </header>

    <!-- GŁÓWNA ZAWARTOŚĆ -->
    <main class="container mx-auto p-4 max-w-xl flex-grow flex items-center justify-center">

        <!-- SEKCJA LOGOWANIA / REJESTRACJI (widoczna gdy brak sesji) -->
        <div id="auth-section" class="bg-slate-800 p-8 rounded-xl shadow-lg w-full border border-slate-700">
            <h2 id="auth-title" class="text-2xl font-bold mb-6 text-center">Zaloguj się do systemu</h2>
            
            <div id="error-msg" class="hidden bg-red-500/20 border border-red-500 text-red-300 p-3 rounded mb-4 text-sm"></div>
            <div id="success-msg" class="hidden bg-green-500/20 border border-green-500 text-green-300 p-3 rounded mb-4 text-sm"></div>

            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-sm mb-1 text-slate-300">Adres E-mail</label>
                    <input type="email" id="email" required class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm mb-1 text-slate-300">Hasło</label>
                    <input type="password" id="password" required minlength="6" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white focus:outline-none focus:border-blue-500">
                </div>
                <button type="submit" id="auth-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium p-2.5 rounded transition">Zaloguj się</button>
            </form>

            <div class="mt-4 text-center text-sm">
                <span id="switch-text" class="text-slate-400">Nie masz konta?</span>
                <button onclick="toggleAuthMode()" id="switch-btn" class="text-blue-400 hover:underline ml-1">Zarejestruj się</button>
            </div>
        </div>

        <!-- SEKCJA KALKULATORA (widoczna po zalogowaniu) -->
        <div id="calculator-section" class="hidden bg-slate-800 p-8 rounded-xl shadow-lg w-full border border-slate-700">
            <h2 class="text-2xl font-bold mb-6 text-center text-blue-400">Kalkulator Finansowy</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm mb-1 text-slate-300">Przychód (zł)</label>
                    <input type="number" id="income" value="10000" oninput="calculate()" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm mb-1 text-slate-300">Koszty (zł)</label>
                    <input type="number" id="costs" value="3000" oninput="calculate()" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div class="bg-slate-900 p-4 rounded border border-slate-700 mt-6 space-y-2">
                    <div class="flex justify-between text-sm">
                        <span class="text-slate-400">Dochód (Przychód - Koszty):</span>
                        <span id="res-profit" class="font-bold text-white">0 zł</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-slate-400">Szacowany podatek (12%):</span>
                        <span id="res-tax" class="font-bold text-red-400">0 zł</span>
                    </div>
                    <div class="flex justify-between text-base border-t border-slate-800 pt-2">
                        <span class="text-slate-200 font-semibold">Zysk netto na czysto:</span>
                        <span id="res-net" class="font-bold text-green-400">0 zł</span>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <footer class="text-center p-4 text-xs text-slate-500 border-t border-slate-800">
        Kalkulator dla Firm &copy; 2026
    </footer>

    <!-- SKRYPT LOGIKI SUPABASE I KALKULATORA -->
    <script>
        const SUPABASE_URL = 'https://unjynbsswcgkrszekiek.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuanluYnNzd2Nna3JzemVraWVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NTA1NzQsImV4cCI6MjEwNTMyNjU3NH0.d7l1q3neZ_8nXMEmz4nPzCjQQwWq9gh4Aq7wlrKpP6U';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isLoginMode = true;

        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            updateUI(session);
        }

        function updateUI(session) {
            const authSection = document.getElementById('auth-section');
            const calcSection = document.getElementById('calculator-section');
            const userInfo = document.getElementById('user-info');
            const userEmail = document.getElementById('user-email');

            if (session) {
                authSection.classList.add('hidden');
                calcSection.classList.remove('hidden');
                userInfo.classList.remove('hidden');
                userEmail.textContent = session.user.email;
                calculate();
            } else {
                authSection.classList.remove('hidden');
                calcSection.classList.add('hidden');
                userInfo.classList.add('hidden');
            }
        }

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').textContent = isLoginMode ? 'Zaloguj się do systemu' : 'Utwórz nowe konto';
            document.getElementById('auth-btn').textContent = isLoginMode ? 'Zaloguj się' : 'Zarejestruj się';
            document.getElementById('switch-text').textContent = isLoginMode ? 'Nie masz konta?' : 'Masz już konto?';
            document.getElementById('switch-btn').textContent = isLoginMode ? 'Zarejestruj się' : 'Zaloguj się';
            hideMessages();
        }

        async function handleAuth(event) {
            event.preventDefault();
            hideMessages();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (isLoginMode) {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    showError(error.message);
                } else {
                    updateUI(data.session);
                }
            } else {
                const { data, error } = await supabaseClient.auth.signUp({ email, password });
                if (error) {
                    showError(error.message);
                } else {
                    showSuccess('Konto zostało utworzone! Możesz się teraz zalogować.');
                    isLoginMode = true;
                    toggleAuthMode();
                }
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            updateUI(null);
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        function showSuccess(msg) {
            const el = document.getElementById('success-msg');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        function hideMessages() {
            document.getElementById('error-msg').classList.add('hidden');
            document.getElementById('success-msg').classList.add('hidden');
        }

        function calculate() {
            const income = parseFloat(document.getElementById('income').value) || 0;
            const costs = parseFloat(document.getElementById('costs').value) || 0;
            
            const profit = income - costs;
            const tax = profit > 0 ? profit * 0.12 : 0;
            const net = profit - tax;

            document.getElementById('res-profit').textContent = profit.toFixed(2) + ' zł';
            document.getElementById('res-tax').textContent = tax.toFixed(2) + ' zł';
            document.getElementById('res-net').textContent = net.toFixed(2) + ' zł';
        }

        checkSession();
    </script>
</body>
</html>
